<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#E9E4FF"/>
    </linearGradient>
    <linearGradient id="accentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Fira Code','Cascadia Code',monospace; }
      .glassPanelL {
        fill: rgba(124,58,237,0.06);
        stroke: rgba(124,58,237,0.30);
        stroke-width: 1;
      }
      .asciiFaceL { fill: #6D28D9; font-size: 6.4px; letter-spacing: -0.3px; }
      .promptL { fill: #6D28D9; }
      .txtL { fill: #1B2A4A; }
      .cursorL { fill: #7C3AED; }
      @keyframes blinkL { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
      .cursorAnimL { animation: blinkL 1s steps(1) infinite; }
      @keyframes glowL { 0%,100% {opacity:0.75;} 50% {opacity:1;} }
      .glowAnimL { animation: glowL 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bgGradLight)"/>
  <rect x="1" y="1" width="898" height="258" rx="18" fill="none" stroke="#7C3AED" stroke-opacity="0.2"/>

  <rect x="30" y="30" width="500" height="200" rx="14" class="glassPanelL"/>
  <circle cx="55" cy="52" r="5" fill="#FF5F56"/>
  <circle cx="72" cy="52" r="5" fill="#FFBD2E"/>
  <circle cx="89" cy="52" r="5" fill="#27C93F"/>

  <g class="mono" font-size="14">
    <text x="50" y="85" class="promptL">$ whoami</text>
    <text x="50" y="110" class="txtL">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.5s" fill="freeze"/>
      &gt; Iverson Pérez
    </text>
    <text x="50" y="135" class="promptL">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.2s" fill="freeze"/>
      $ cat rol.txt
    </text>
    <text x="50" y="160" class="txtL">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.7s" fill="freeze"/>
      &gt; Full-Stack Developer · Data Analyst
    </text>
    <text x="50" y="185" class="promptL">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.4s" fill="freeze"/>
      $ echo $UBICACION
    </text>
    <text x="50" y="210" class="txtL">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.9s" fill="freeze"/>
      &gt; Guatemala 🇬🇹 · Disponible ahora
    </text>
    <rect x="45" y="200" width="9" height="14" class="cursorL cursorAnimL">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.9s" fill="freeze"/>
    </rect>
  </g>

  <rect x="550" y="30" width="320" height="200" rx="14" class="glassPanelL"/>
  <text class="mono asciiFaceL glowAnimL">
      <tspan x="560" y="42.0">------::...::.... :....+:      .  ...         </tspan>
      <tspan x="560" y="48.6">=:::...:::::::....-:---*-:::....:::...... ..  </tspan>
      <tspan x="560" y="55.2">--=--:........::.::..--*--+*==-==++=+==--..--:</tspan>
      <tspan x="560" y="61.8">----=======--==:.--..::+=========-+**++++=::=+</tspan>
      <tspan x="560" y="68.4">--:---++=+==--=+#######%####*+==---=--===--:::</tspan>
      <tspan x="560" y="75.0">::...-+=-:::::*@@@@@@@@@@@@@@@%*++=+++++++++++</tspan>
      <tspan x="560" y="81.6">==---==-:::::+@@@@%##*++*##%@@@@#******#***%%#</tspan>
      <tspan x="560" y="88.2">-----=+======%@@%#*+++++=+++#@@@##%%*#%#*+*%#*</tspan>
      <tspan x="560" y="94.8">::::::::::::-%@%**###*++******@@#*###%%#**##==</tspan>
      <tspan x="560" y="101.4">---------::::#@***###*=+###**+#@+==+++++++++++</tspan>
      <tspan x="560" y="108.0">---------::-:=#==+***=-=+*#*=-+%-:::::::::----</tspan>
      <tspan x="560" y="114.6">--------------====++****+++=---=:---::-:--::::</tspan>
      <tspan x="560" y="121.2">--------------=+++*+*****+*++==-------:-------</tspan>
      <tspan x="560" y="127.8">=====---====---++**#*****##*+=----------------</tspan>
      <tspan x="560" y="134.4">===-====--======+*++*****++++*+---------------</tspan>
      <tspan x="560" y="141.0">=+=====*++=======**+++++++**+%@#+++=-------==-</tspan>
      <tspan x="560" y="147.6">*#==#*=*%=====++****#####****%@@@%%%*+++=====-</tspan>
      <tspan x="560" y="154.2">+#+=++=*#+=#**#%@******##***#@@@@@%#*****++++=</tspan>
      <tspan x="560" y="160.8">#%%##%#++***##%@#**********#@@@@@@%@@@%%##**#*</tspan>
      <tspan x="560" y="167.4">@@@@@@#***###%@@+++*******#@@@@@@@@@@@%%@@%##*</tspan>
      <tspan x="560" y="174.0">@***#*#%@@@@@@@@%*++***#%@@@@@@@@@@@@@@%%@@%%%</tspan>
      <tspan x="560" y="180.6">%@###%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</tspan>
      <tspan x="560" y="187.2">%##%@@@@%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</tspan>
  </text>
  <text x="710" y="222" text-anchor="middle" fill="#6D28D9" font-size="9" class="mono" opacity="0.85">Iverson · &lt;/&gt; dev</text>

  <rect x="30" y="245" width="840" height="2" fill="url(#accentLight)"/>
</svg>
