<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#E9E4FF"/>
    </linearGradient>
    <linearGradient id="accentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Fira Code','Cascadia Code',monospace; }
      .glassPanelL {
        fill: rgba(124,58,237,0.06);
        stroke: rgba(124,58,237,0.30);
        stroke-width: 1;
      }
      .promptL { fill: #6D28D9; }
      .txtL { fill: #1B2A4A; }
      .nameL { fill: #1B2A4A; font-weight: 700; }
      .cursorL { fill: #7C3AED; }
      @keyframes blinkL { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
      .cursorAnimL { animation: blinkL 1s steps(1) infinite; }
    </style>
  </defs>

  <rect width="900" height="200" rx="18" fill="url(#bgGradLight)"/>
  <rect x="1" y="1" width="898" height="198" rx="18" fill="none" stroke="#7C3AED" stroke-opacity="0.2"/>

  <rect x="20" y="20" width="860" height="160" rx="14" class="glassPanelL"/>
  <circle cx="45" cy="42" r="5" fill="#FF5F56"/>
  <circle cx="62" cy="42" r="5" fill="#FFBD2E"/>
  <circle cx="79" cy="42" r="5" fill="#27C93F"/>

  <g class="mono">
    <text x="40" y="90" class="promptL" font-size="16">$ whoami</text>
    <text x="40" y="130" class="nameL" font-size="34">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>
      Iverson Maldonado
    </text>
    <rect x="380" y="112" width="12" height="24" class="cursorL cursorAnimL">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="40" y="160" class="txtL" font-size="15">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/>
      &gt; Full-Stack Developer · Guatemala
    </text>
  </g>

  <rect x="20" y="185" width="860" height="2" fill="url(#accentLight)"/>
</svg>
