<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <linearGradient id="accentDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0"/>
    </filter>
    <style>
      .mono { font-family: 'Fira Code','Cascadia Code',monospace; }
      .glassPanel {
        fill: rgba(124,58,237,0.08);
        stroke: rgba(168,85,247,0.35);
        stroke-width: 1;
      }
      .prompt { fill: #7C3AED; }
      .txt { fill: #E5E7EB; }
      .cursor { fill: #A855F7; }
      @keyframes blink { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
      .cursorAnim { animation: blink 1s steps(1) infinite; }
    </style>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bgGradDark)"/>
  <rect x="1" y="1" width="898" height="258" rx="18" fill="none" stroke="#7C3AED" stroke-opacity="0.25"/>

  <!-- glass panel terminal, ancho completo -->
  <rect x="30" y="30" width="840" height="200" rx="14" class="glassPanel" filter="url(#glass)"/>
  <circle cx="55" cy="52" r="5" fill="#FF5F56"/>
  <circle cx="72" cy="52" r="5" fill="#FFBD2E"/>
  <circle cx="89" cy="52" r="5" fill="#27C93F"/>

  <g class="mono" font-size="16">
    <text x="50" y="90" class="prompt">$ whoami</text>
    <text x="50" y="118" class="txt">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.5s" fill="freeze"/>
      &gt; Iverson Pérez Maldonado
    </text>
    <text x="50" y="146" class="prompt">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.2s" fill="freeze"/>
      $ cat rol.txt
    </text>
    <text x="50" y="174" class="txt">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.7s" fill="freeze"/>
      &gt; Full-Stack Developer
    </text>
    <text x="50" y="202" class="prompt">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.4s" fill="freeze"/>
      $ echo $UBICACION
    </text>
    <text x="440" y="202" class="txt">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.9s" fill="freeze"/>
      &gt; Guatemala · Disponible ahora
    </text>
    <rect x="425" y="192" width="10" height="16" class="cursor cursorAnim">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.9s" fill="freeze"/>
    </rect>
  </g>

  <rect x="30" y="245" width="840" height="2" fill="url(#accentDark)"/>
</svg>
